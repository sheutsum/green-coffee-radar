<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>생두 레이더</title>
  <meta name="description" content="국내 스페셜티 생두 신상품 알림 — 11개 생두회사 카탈로그를 한곳에서 추적합니다." />

  <!-- PWA / iOS home-screen app -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="생두레이더" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="appHeader">
      <div class="header-top">
        <div class="header-titles">
          <h1 id="viewTitle">생두 레이더</h1>
          <p class="header-sub" id="headerSub">불러오는 중…</p>
        </div>
        <button class="icon-btn" id="refreshBtn" aria-label="새로고침" title="새로고침">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" inputmode="search" enterkeyhint="search"
               placeholder="원두·산지·가공방식 검색" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="clear-btn hidden" id="clearSearch" aria-label="검색어 지우기">✕</button>
      </div>
      <div class="chips" id="filterChips"></div>
    </header>

    <!-- Main scroll area -->
    <main id="main" class="content">
      <div id="offlineBanner" class="offline-banner hidden">오프라인 — 저장된 데이터를 보는 중</div>
      <div id="list" class="list"></div>
      <div id="emptyState" class="empty hidden">
        <div class="empty-emoji">☕️</div>
        <p id="emptyText">결과가 없습니다.</p>
      </div>
      <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>카탈로그를 불러오는 중…</p>
      </div>
    </main>

    <!-- Tab bar -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="all">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span>전체</span>
      </button>
      <button class="tab" data-view="new">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l2.4 6.9H22l-6 4.4 2.3 7-6.3-4.6L5.7 20l2.3-7-6-4.4h7.6z" fill="currentColor"/></svg>
        <span>신상품</span>
        <em class="tab-badge hidden" id="newBadge">0</em>
      </button>
      <button class="tab" data-view="fav">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21s-7.5-4.7-10-9.3C.4 8.4 2 5 5.3 5c2 0 3.3 1.1 4.2 2.3l.5.7.5-.7C11.4 6.1 12.7 5 14.7 5 18 5 19.6 8.4 22 11.7 19.5 16.3 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>즐겨찾기</span>
      </button>
      <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5c-.6.2-1.2.6-1.7 1l-2.3-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.3-1c.5.4 1.1.8 1.7 1l.4 2.5h4l.4-2.5c.6-.2 1.2-.6 1.7-1l2.3 1 2-3.4-2-1.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>설정</span>
      </button>
    </nav>
  </div>

  <!-- Detail sheet -->
  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  <div id="detailSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="상품 상세">
    <div class="sheet-grabber"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
