name: probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip -q install curl_cffi httpx
      - shell: python
        run: |
          import httpx, time
          from curl_cffi import requests as cc
          F="https://korea.falcon-micro.com"
          urls=[F+"/collections/korea-store-all-coffee/products.json?limit=250",
                F+"/products.json?limit=250",
                F+"/collections/korea-store-all-coffee.atom",
                F+"/collections/korea-store-all-coffee",
                F+"/sitemap_products_1.xml"]
          for i in range(3):
            for u in urls:
              for imp in ("chrome131","safari17_0"):
                try:
                  r=cc.get(u,impersonate=imp,timeout=20)
                  print(i,imp,r.status_code,len(r.text),u[len(F):60])
                except Exception as e: print(i,imp,"ERR",e,u)
            time.sleep(5)
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36","Accept-Language":"ko-KR"}
          for i in range(3):
            r=httpx.get("https://blessbean.co.kr/shop/list.php?ca_id=2010",headers=H,follow_redirects=True,timeout=20)
            t=r.text
            print("bless",r.status_code,str(r.url),len(t),t.count("/shop/"),t.count("item-list"))
            print(t[:600].replace("\n"," "))
            time.sleep(5)
