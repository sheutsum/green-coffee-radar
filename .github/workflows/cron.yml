name: green-coffee-radar

on:
  schedule:
    # 정각/30분(:00,:30)은 GitHub 부하가 가장 커서 schedule 트리거가 자주 드롭됨 →
    # 혼잡 시간대를 피해 :37 로 오프셋. 그래도 schedule은 best-effort라
    # 하루 수회만 뜰 수 있음. 안정적 주기가 필요하면 외부 핑거(workflow_dispatch) 사용.
    #
    # 2026-08-16: :07 슬롯 제거. 로컬 핑거가 매시 :01에 쏘는데, 아래
    # cancel-in-progress: true 와 겹치면 :07 스케줄이 그 실행을 취소해버린다.
    # 실측 한 바퀴 ~7분이라 :07은 아슬아슬하고 :37은 확실히 안전하다.
    # 사이트별 throttle/retry는 scrapers/base.py 의 polite_sleep/get_with_retry 참고.
    - cron: '37 * * * *'
  workflow_dispatch: {}

# contents: 상태(seen.sqlite/feed.json) 커밋 / pages·id-token: PWA 배포
permissions:
  contents: write
  pages: write
  id-token: write

# Pages 배포는 동시에 하나만 (스케줄 겹침 방지)
#
# 2026-08-16: false → true. 2026-08-12 실행 하나가 러너를 배정받지 못한 채
# queued 로 박혀서(GitHub 쪽 stuck job) 이 그룹을 4일간 물고 있었고, 뒤따른 97개
# 실행이 전부 pending → cancelled 로 죽었다. 알림이 조용히 끊겼는데 실패 메일도
# 안 온다(취소는 실패가 아니라서). true면 다음 실행이 박힌 놈을 밀어내고 한
# 사이클 안에 스스로 복구된다.
# 대가: 진짜로 돌던 실행이 중간에 잘리면 seen.sqlite 커밋을 못 해 다음 실행에서
# 같은 상품이 한 번 더 알림 온다. 4일 무음보다 낫다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # 실측 한 바퀴 ~7분(2026-08-16). 30분을 넘겼다면 정상 실행이 아니라 어딘가
    # 매달린 것이므로 끊는다 — cancel-in-progress: true 라 방치하면 다음 트리거를
    # 스스로 잡아먹는다.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 작업 트리 전체를 원격 main 최신본으로 강제 동기화.
      # checkout@v4는 "트리거한 SHA"를 가져오는데, 이 SHA가 직전 실행의
      # auto-commit을 반영 못 하면(schedule 이벤트 지연/배치, push 레이스)
      # (a) 같은 상품을 다시 "새 SKU"로 보고 중복 알림이 나고
      # (b) 마지막 auto-commit push가 non-fast-forward로 튕겨 실행이 실패한다.
      #
      # 2026-08-16: 전에는 `git checkout FETCH_HEAD -- seen.sqlite` 로 파일만
      # 끌어왔는데, HEAD가 낡은 SHA에 남아 (b)를 못 막았다. reset --hard 면
      # seen.sqlite 최신화와 fast-forward push가 한 번에 해결된다.
      - name: Sync to latest main
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD

      # 스크레이프 → 텔레그램 알림 → web/feed.json 생성 (단일 수집)
      - name: Scrape, notify, build feed
        run: python run.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}

      # 위의 sync 는 스크레이프 "전"에 돌기 때문에, 수집이 도는 ~7분 사이에
      # main 이 앞서가면(사람이 커밋을 밀면) push 가 non-fast-forward 로 튕긴다.
      # 실제로 2026-08-16 두 번 발생. git-auto-commit-action 은 rebase/retry 를
      # 안 해서 그대로 실행 실패 → 실패 메일이 된다.
      #
      # 그래서 액션을 걷어내고 직접 처리한다: 튕기면 최신 main 을 받아 그 위에
      # 이번 실행의 상태 파일만 다시 얹고 재시도. 상태 파일은 항상 이번 실행
      # 결과가 최신이므로 우리 것이 이기는 게 맞고, reset --hard 후 덮어쓰기라
      # 남의 커밋(코드 변경 등)은 그대로 보존된다.
      - name: Commit state + feed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- seen.sqlite web/feed.json; then
            echo "no state change"
            exit 0
          fi

          tmp=$(mktemp -d)
          cp seen.sqlite "$tmp/" && cp web/feed.json "$tmp/"

          for attempt in 1 2 3; do
            git add seen.sqlite web/feed.json
            git commit -q -m "state: update seen.sqlite + feed.json" || true
            if git push -q origin HEAD:main; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected — main moved, replaying on top (attempt $attempt)"
            git fetch -q --depth=1 origin main
            git reset --hard -q FETCH_HEAD
            cp "$tmp/seen.sqlite" . && cp "$tmp/feed.json" web/
          done

          echo "::error::상태 커밋 push 가 3회 모두 실패" >&2
          exit 1

      # --- PWA(web/)를 GitHub Pages로 배포 ---
      # 최초 1회 레포 Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 함.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
