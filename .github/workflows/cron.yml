name: green-coffee-radar

on:
  schedule:
    # 30분 간격 (UTC). 신상 마이크로랏을 빨리 잡기 위함.
    # 정각/30분(:00,:30)은 GitHub 부하가 가장 커서 schedule 트리거가 자주 드롭됨 →
    # 혼잡 시간대를 피해 :07,:37 로 오프셋. 그래도 schedule은 best-effort라
    # 하루 수회만 뜰 수 있음. 안정적 30분 간격이 필요하면 외부 핑거(workflow_dispatch) 사용.
    # 사이트별 throttle/retry는 scrapers/base.py 의 polite_sleep/get_with_retry 참고.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

# contents: 상태(seen.sqlite/feed.json) 커밋 / pages·id-token: PWA 배포
permissions:
  contents: write
  pages: write
  id-token: write

# Pages 배포는 동시에 하나만 (스케줄 겹침 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # dedup DB를 원격 main 최신본으로 강제 동기화.
      # checkout@v4는 "트리거한 SHA"의 seen.sqlite를 가져오는데, 이 SHA가
      # 직전 실행의 auto-commit을 반영 못 하면(schedule 이벤트 지연/배치, push 레이스)
      # 같은 상품을 다시 "새 SKU"로 보고 중복 알림이 난다. 항상 최신 seen으로 비교.
      - name: Sync dedup state to latest main
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- seen.sqlite || echo "no seen.sqlite on remote yet"

      # 스크레이프 → 텔레그램 알림 → web/feed.json 생성 (단일 수집)
      - name: Scrape, notify, build feed
        run: python run.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}

      - name: Commit state + feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "state: update seen.sqlite + feed.json"
          file_pattern: "seen.sqlite web/feed.json"

      # --- PWA(web/)를 GitHub Pages로 배포 ---
      # 최초 1회 레포 Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 함.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
