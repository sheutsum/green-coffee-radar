name: green-coffee-radar

on:
  schedule:
    # 30분마다 (UTC). 신상 마이크로랏을 빨리 잡기 위함.
    # 사이트별 throttle/retry는 scrapers/base.py 의 polite_sleep/get_with_retry 참고.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# contents: 상태(seen.sqlite/feed.json) 커밋 / pages·id-token: PWA 배포
permissions:
  contents: write
  pages: write
  id-token: write

# Pages 배포는 동시에 하나만 (스케줄 겹침 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 스크레이프 → 텔레그램 알림 → web/feed.json 생성 (단일 수집)
      - name: Scrape, notify, build feed
        run: python run.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}

      - name: Commit state + feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "state: update seen.sqlite + feed.json"
          file_pattern: "seen.sqlite web/feed.json"

      # --- PWA(web/)를 GitHub Pages로 배포 ---
      # 최초 1회 레포 Settings → Pages → Source 를 "GitHub Actions" 로 지정해야 함.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
